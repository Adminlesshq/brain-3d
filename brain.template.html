<style>
/* Layout: full-bleed 3D scene on a dark ground; a sources rail on the left, a note sheet on the right, transport controls at the bottom. */
:root {
  /*__THEME__*/
  --panel: rgba(10, 10, 10, 0.8);
  --line: rgba(150, 150, 150, 0.22);
  --display: "Syne", "Arial Black", system-ui, sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: var(--body); font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; outline: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -140%); white-space: nowrap; font: 500 11.5px/1.2 var(--body); color: var(--text); background: rgba(0,0,0,0.62); border: 1px solid var(--line); padding: 3px 7px; border-radius: 3px; will-change: transform; }
.lbl.cat { background: none; border: none; font: 700 12px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; transform: translate(-50%, -50%); text-shadow: 0 0 12px #000; }
.lbl.hover { border-color: var(--accent); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; display: flex; align-items: center; gap: 14px; pointer-events: none; z-index: 3; }
.top img { height: 30px; width: auto; display: block; }
.top img + .ttl { border-left: 1px solid var(--line); padding-left: 14px; }
.top h1 { margin: 0; font: 700 20px/1 var(--display); letter-spacing: -0.5px; }
.top p { margin: 4px 0 0; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

/* panels */
.panel { position: fixed; z-index: 2; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#side { top: calc(env(safe-area-inset-top, 0px) + 72px); left: 16px; width: 272px; max-height: calc(100% - 172px); display: flex; flex-direction: column; overflow: hidden; }
#side .scroll { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font: 500 10.5px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
#q { width: 100%; box-sizing: border-box; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 4px; color: var(--text); padding: 9px 10px; font: 400 13px var(--body); }
#q::placeholder { color: var(--muted); }
.src { display: grid; grid-template-columns: 1fr auto; gap: 2px; }
.srow { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 0; padding: 6px 4px; border-radius: 3px; cursor: pointer; text-align: left; }
.srow:hover { background: rgba(255,255,255,0.05); }
.srow .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
.srow .nm { flex: 1; min-width: 0; }
.srow .ct { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.srow.off { opacity: 0.38; }
.srow.off .dot { box-shadow: none; }
.solo { background: none; border: 1px solid transparent; color: var(--muted); font-size: 11px; padding: 0 7px; border-radius: 3px; cursor: pointer; }
.solo:hover, .solo.on { border-color: var(--line); color: var(--accent); }
.health { display: flex; flex-direction: column; gap: 4px; }
.hrow { display: flex; justify-content: space-between; align-items: center; background: none; border: 0; padding: 6px 4px; border-radius: 3px; cursor: pointer; text-align: left; width: 100%; }
.hrow:hover { background: rgba(255,255,255,0.05); }
.hrow b { font-weight: 500; font-variant-numeric: tabular-nums; }
.hrow.alert b { color: color-mix(in srgb, var(--alert) 60%, white); }
.hrow.on { background: color-mix(in srgb, var(--alert) 18%, transparent); }
.inv { display: flex; flex-direction: column; gap: 10px; }
.inv h4 { margin: 0; font: 600 11px/1 var(--body); color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; display: flex; gap: 7px; align-items: center; }
.inv h4 i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.inv ul { list-style: none; margin: 4px 0 0; padding: 0; }
.inv li button { background: none; border: 0; padding: 4px 4px 4px 14px; width: 100%; text-align: left; cursor: pointer; border-radius: 3px; color: var(--text); font-size: 12.5px; line-height: 1.35; }
.inv li button:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
.legend { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 18px; height: 0; border-top: 2px solid; display: inline-block; }

#detail { top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; width: 340px; max-height: calc(100% - 116px); overflow-y: auto; padding: 18px; box-sizing: border-box; }
#detail .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; background: none; border: 1px solid transparent; border-radius: 4px; color: var(--muted); cursor: pointer; font-size: 18px; line-height: 1; }
#detail .x:hover { border-color: var(--line); color: var(--text); }
.chip { display: inline-flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.chip i { width: 8px; height: 8px; border-radius: 50%; }
#detail h2 { font: 700 22px/1.15 var(--display); letter-spacing: -0.6px; margin: 10px 30px 6px 0; text-wrap: balance; }
.path { font-size: 12px; color: var(--muted); word-break: break-all; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.tag { font-size: 11.5px; border: 1px solid var(--line); border-radius: 3px; padding: 3px 7px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag.alert { border-color: var(--alert); color: color-mix(in srgb, var(--alert) 55%, white); background: color-mix(in srgb, var(--alert) 15%, transparent); }
#detail .sum { font-size: 14px; line-height: 1.55; color: #e9e3dc; margin: 0 0 16px; }
#detail h3 { font: 600 11px/1 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
.secs { margin: 0; padding-left: 16px; color: #d8d2ca; font-size: 13px; line-height: 1.6; }
.links { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.links button { display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: 0; padding: 5px 4px; border-radius: 3px; text-align: left; cursor: pointer; font-size: 13px; }
.links button:hover { background: rgba(255,255,255,0.05); color: var(--accent); }
.links i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.links span { flex: 1; min-width: 0; }
.links em { font-style: normal; font-size: 10.5px; color: var(--muted); letter-spacing: 0.04em; }

/* controls */
#bar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 3; display: flex; align-items: center; gap: 6px; padding: 6px; max-width: calc(100% - 32px); box-sizing: border-box; flex-wrap: wrap; justify-content: center; }
.btn { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 4px; padding: 8px 13px; cursor: pointer; font-size: 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #000; }
.btn.primary:hover { filter: brightness(1.08); }
#count { padding: 0 10px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#count b { color: var(--text); font-weight: 500; }
#menuBtn { display: none; }

/* cinema */
#cine { position: fixed; left: calc(16px + 2vw); top: 50%; transform: translateY(-50%); z-index: 2; pointer-events: none; display: none; }
#cine .n { font: 800 clamp(48px, 9vw, 112px)/0.9 var(--display); letter-spacing: -3px; color: var(--accent); font-variant-numeric: tabular-nums; }
#cine .l { font: 500 12px/1 var(--body); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin: 10px 0 26px; }
#cine .n.s { font-size: clamp(30px, 5vw, 56px); color: var(--text); }
body.cinema #side, body.cinema #detail, body.cinema #labels .lbl:not(.cat) { display: none !important; }
body.cinema #cine { display: block; }
body.cinema .top p { display: none; }

#credit { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); z-index: 1; color: var(--muted); font-size: 11.5px; text-decoration: none; opacity: 0.7; }
#credit:hover { opacity: 1; color: var(--text); }
body.cinema #credit { display: none; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); }

@media (max-width: 760px) {
  .top img { height: 22px; }
  .top h1 { font-size: 16px; }
  .top p { display: none; }
  #menuBtn { display: inline-block; }
  #side { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); left: 16px; right: 16px; width: auto; max-height: 55%; display: none; }
  body.menu #side { display: flex; }
  #detail { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 74px); left: 16px; right: 16px; width: auto; max-height: 55%; }
  #cine { top: auto; bottom: 120px; transform: none; }
  #cine .l { margin-bottom: 12px; }
  #credit { display: none; }
  .btn { padding: 8px 10px; }
}

<script>window.BRAIN = /*__GRAPH__*/null;</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const G = window.BRAIN;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- data ---------- */
const CAT = Object.fromEntries(G.categories.map((c) => [c.id, c]));
const N = G.nodes.length;
const byId = new Map(G.nodes.map((n, i) => [n.id, i]));
const nodes = G.nodes.map((n) => ({ ...n, nb: new Set(), out: [], inc: [] }));
const edges = G.edges.map((e) => ({ s: byId.get(e.s), t: byId.get(e.t), k: e.k }));
edges.forEach((e, i) => {
  nodes[e.s].nb.add(e.t); nodes[e.t].nb.add(e.s);
  nodes[e.s].out.push(i); nodes[e.t].inc.push(i);
});
const centerIdx = byId.get(G.center);
const T = G.theme;
const inner = (cid) => !!CAT[cid].inner;

$("#stats").textContent = `${N} notes · ${edges.length} connections · built ${G.built}`;

/* ---------- layout: stable sphere, one region per source ---------- */
function hash(str) { let h = 2166136261; for (const ch of str) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
const S = Math.max(1, Math.sqrt(N / 120));
const R = 100 * S;
const outerCats = G.categories.filter((c) => !c.inner);
const anchors = {};
outerCats.forEach((c, i) => {
  const y = 1 - (i + 0.5) / outerCats.length * 2;
  const r = Math.sqrt(1 - y * y);
  const th = i * Math.PI * (3 - Math.sqrt(5));
  anchors[c.id] = new THREE.Vector3(Math.cos(th) * r, y * 0.85, Math.sin(th) * r).normalize();
});
G.categories.filter((c) => c.inner).forEach((c) => (anchors[c.id] = new THREE.Vector3()));
const pos = nodes.map((n, i) => {
  if (i === centerIdx) return new THREE.Vector3();
  const a = anchors[n.cat];
  const u = hash(n.id), v = hash(n.id + "#");
  if (inner(n.cat)) {
    const th = u * Math.PI * 2, ph = Math.acos(2 * v - 1);
    return new THREE.Vector3().setFromSphericalCoords(28, ph, th);
  }
  const t1 = new THREE.Vector3(0, 1, 0).cross(a).normalize();
  const t2 = a.clone().cross(t1).normalize();
  const sp = 0.75;
  return a.clone().add(t1.multiplyScalar((u - 0.5) * sp)).add(t2.multiplyScalar((v - 0.5) * sp)).normalize().multiplyScalar(R);
});
(function relax() {
  const f = nodes.map(() => new THREE.Vector3());
  const d = new THREE.Vector3();
  const ITER = N > 300 ? Math.max(40, Math.round((220 * 300) / N)) : 220;
  for (let it = 0; it < ITER; it++) {
    f.forEach((v) => v.set(0, 0, 0));
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      d.subVectors(pos[i], pos[j]); const l2 = Math.max(d.lengthSq(), 4);
      d.multiplyScalar(260 / l2 / Math.sqrt(l2)); f[i].add(d); f[j].sub(d);
    }
    for (const e of edges) {
      d.subVectors(pos[e.t], pos[e.s]); const l = d.length() || 1;
      const w = e.k === "mention" ? 0.004 : 0.012;
      d.multiplyScalar(((l - 30) / l) * w); f[e.s].add(d); f[e.t].sub(d);
    }
    for (let i = 0; i < N; i++) {
      if (i === centerIdx) continue;
      const n = nodes[i];
      if (!inner(n.cat)) f[i].add(anchors[n.cat].clone().multiplyScalar(R).sub(pos[i]).multiplyScalar(0.02));
      pos[i].add(f[i].clampLength(0, 6));
      const r = pos[i].length() || 1;
      const [lo, hi] = inner(n.cat) ? [20, 38] : [R * 0.82, R * 1.08];
      pos[i].multiplyScalar(THREE.MathUtils.clamp(r, lo, hi) / r);
    }
  }
})();
pos[centerIdx].set(0, 0, 0);

/* ---------- scene ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); }
catch (err) { document.body.insertAdjacentHTML("beforeend", '<div id="nogl">This browser could not start 3D graphics. Try Chrome or Edge with hardware acceleration on.</div>'); throw err; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(new THREE.Color(T.background), 1);
$("#stage").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(new THREE.Color(T.background), 0.0016 / S);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 4000);
camera.position.set(0, 60 * S, 330 * S);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 25; controls.maxDistance = 900 * S;
controls.autoRotate = !reduced; controls.autoRotateSpeed = 0.35;
let userTook = false;
controls.addEventListener("start", () => { userTook = true; });

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.85, 0.55, 0.12);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function glowTexture(ring) {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  if (ring) {
    g.strokeStyle = "#fff"; g.lineWidth = 7; g.beginPath(); g.arc(64, 64, 52, 0, Math.PI * 2); g.stroke();
  } else {
    const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.18, "rgba(255,255,255,0.55)");
    gr.addColorStop(0.5, "rgba(255,255,255,0.12)"); gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const GLOW = glowTexture(false), RING = glowTexture(true);
const sphereGeo = new THREE.IcosahedronGeometry(1, 3);
const ALERT = new THREE.Color(T.alert);
const ACC = new THREE.Color(T.accent);

const meshes = nodes.map((n, i) => {
  const col = new THREE.Color(CAT[n.cat].color);
  const size = i === centerIdx ? 6.5 : 1.3 + Math.log2(n.words + 2) * 0.3;
  n.size = size; n.col = col;
  const m = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: col.clone().multiplyScalar(1.15), transparent: true }));
  m.userData.i = i;
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: col, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.4 }));
  scene.add(m, halo);
  let ring = null;
  if (n.stub) {
    ring = new THREE.Sprite(new THREE.SpriteMaterial({ map: RING, color: ALERT, transparent: true, depthWrite: false, opacity: 0.9 }));
    scene.add(ring);
  }
  return { m, halo, ring };
});

// the central orb
const orb = [];
[[34, 0.55, 0], [70, 0.22, -0.03], [130, 0.08, -0.06]].forEach(([s, o, h]) => {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: ACC.clone().offsetHSL(h, 0, h), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: o }));
  sp.scale.setScalar(s); sp.userData.base = s; sp.userData.op = o; scene.add(sp); orb.push(sp);
});

// orbital accents
const rings = [];
[[R * 1.28, 0.16, [1.1, 0, 0.3]], [R * 1.42, 0.09, [0.4, 0, -0.9]]].forEach(([r, o, rot]) => {
  const pts = []; for (let k = 0; k <= 160; k++) { const a = (k / 160) * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); }
  const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: new THREE.Color(T.muted), transparent: true, opacity: o }));
  l.rotation.set(...rot); scene.add(l); rings.push(l);
});
// distant dust
{
  const P = 700, arr = new Float32Array(P * 3);
  for (let k = 0; k < P; k++) {
    const v = new THREE.Vector3().setFromSphericalCoords((380 + hash("d" + k) * 900) * S, Math.acos(2 * hash("p" + k) - 1), hash("t" + k) * Math.PI * 2);
    arr.set([v.x, v.y, v.z], k * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(arr, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: new THREE.Color(T.muted), size: 1.4, transparent: true, opacity: 0.35, depthWrite: false })));
}

// connections
const ePos = new Float32Array(edges.length * 6), eCol = new Float32Array(edges.length * 8);
const eGeo = new THREE.BufferGeometry();
eGeo.setAttribute("position", new THREE.BufferAttribute(ePos, 3));
eGeo.setAttribute("color", new THREE.BufferAttribute(eCol, 4));
const eLines = new THREE.LineSegments(eGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
scene.add(eLines);
const MENTION = new THREE.Color(T.muted);

// restrained particles along real links
const flowEdges = edges.map((e, i) => i).filter((i) => edges[i].k !== "mention");
const PN = Math.min(flowEdges.length, 110);
const pArr = new Float32Array(PN * 3);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute("position", new THREE.BufferAttribute(pArr, 3));
const pMat = new THREE.PointsMaterial({ color: ACC, size: 1.8, map: GLOW, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.85 });
const parts = new THREE.Points(pGeo, pMat); scene.add(parts);
const pInfo = Array.from({ length: PN }, (_, k) => ({ e: flowEdges[Math.floor((k / PN) * flowEdges.length)], ph: hash("q" + k), sp: 0.08 + hash("s" + k) * 0.1 }));

/* ---------- state ---------- */
const catOn = Object.fromEntries(G.categories.map((c) => [c.id, true]));
let solo = null, query = "", selected = -1, hovered = -1, healthOn = false;
let growing = false, paused = false, gt = Infinity, ambient = 0;
const GROW_T = 24;
const born = nodes.map((n) => (n.order === 0 ? 0 : 1.2 + GROW_T * Math.pow(n.order / (N - 1), 0.55)));
const cur = nodes.map(() => new THREE.Vector3());
const vis = new Float32Array(N);

function focusSet() {
  if (selected >= 0) return new Set([selected, ...nodes[selected].nb]);
  if (healthOn) return new Set(nodes.map((n, i) => (n.stub ? i : -1)).filter((i) => i >= 0));
  if (query) {
    const q = query.toLowerCase();
    return new Set(nodes.map((n, i) => ((n.title + " " + n.id + " " + n.summary).toLowerCase().includes(q) ? i : -1)).filter((i) => i >= 0));
  }
  return null;
}
let focus = null;
function refresh() { focus = focusSet(); renderSide(); }
const enabled = (i) => catOn[nodes[i].cat];
const ease = (x) => 1 - Math.pow(1 - x, 3);

/* ---------- labels ---------- */
const labelLayer = $("#labels");
const catLabels = G.categories.filter((c) => !c.inner).map((c) => {
  const el = document.createElement("div"); el.className = "lbl cat"; el.textContent = c.label; el.style.color = c.color;
  labelLayer.appendChild(el);
  const members = nodes.map((n, i) => (n.cat === c.id ? i : -1)).filter((i) => i >= 0);
  const p = new THREE.Vector3(); members.forEach((i) => p.add(pos[i])); p.divideScalar(Math.max(members.length, 1)).setLength(R * 1.24);
  return { el, p, id: c.id, members };
});
const pool = [];
function nodeLabel(k) { while (pool.length <= k) { const el = document.createElement("div"); el.className = "lbl"; labelLayer.appendChild(el); pool.push(el); } return pool[k]; }
const v3 = new THREE.Vector3();
function place(el, p, show) {
  if (!show) { el.style.display = "none"; return; }
  v3.copy(p).project(camera);
  if (v3.z > 1) { el.style.display = "none"; return; }
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  el.style.display = "block";
  el.style.transform = `translate(${(v3.x * 0.5 + 0.5) * w}px, ${(-v3.y * 0.5 + 0.5) * h}px) translate(-50%, -140%)`;
}
function placeCat(el, p, show) {
  if (!show) { el.style.display = "none"; return; }
  v3.copy(p).project(camera);
  if (v3.z > 1) { el.style.display = "none"; return; }
  const w = renderer.domElement.clientWidth, h = renderer.domElement.clientHeight;
  el.style.display = "block";
  el.style.transform = `translate(${(v3.x * 0.5 + 0.5) * w}px, ${(-v3.y * 0.5 + 0.5) * h}px) translate(-50%, -50%)`;
}

/* ---------- frame ---------- */
const clock = new THREE.Clock();
let fly = null;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!paused) { ambient += dt; if (growing) gt += dt; }
  if (growing && gt > born[born.length - 1] + 1.5 && gt > GROW_T + 1.5) { growing = false; gt = Infinity; $("#playBtn").textContent = "Replay growth"; }

  // node animation
  let shown = 0;
  for (let i = 0; i < N; i++) {
    const n = nodes[i];
    const v = growing ? THREE.MathUtils.clamp((gt - born[i]) / 0.9, 0, 1) : 1;
    vis[i] = v;
    const e = ease(v);
    const from = n.parent != null ? cur[byId.get(n.parent)] : pos[i].clone().multiplyScalar(0.6);
    cur[i].lerpVectors(from, pos[i], e);
    if (v > 0) shown++;
    const on = enabled(i);
    const inF = !focus || focus.has(i);
    const a = on ? (inF ? 1 : 0.1) : 0.025;
    const { m, halo, ring } = meshes[i];
    const pulse = i === centerIdx ? 1 + Math.sin(ambient * 1.6) * 0.04 : 1;
    const s = n.size * e * pulse * (i === selected ? 1.5 : i === hovered ? 1.3 : 1);
    m.position.copy(cur[i]); m.scale.setScalar(Math.max(s, 0.0001));
    m.material.opacity = a; m.visible = v > 0;
    halo.position.copy(cur[i]); halo.scale.setScalar(n.size * 5.5 * e); halo.material.opacity = 0.42 * a * (i === selected ? 1.6 : 1); halo.visible = v > 0;
    if (ring) { ring.position.copy(cur[i]); ring.scale.setScalar(n.size * 3.2 * e); ring.material.opacity = (healthOn ? 1 : 0.7) * a; ring.visible = v > 0; }
  }
  // orb
  const ov = vis[centerIdx];
  orb.forEach((sp, k) => { sp.scale.setScalar(sp.userData.base * (1 + Math.sin(ambient * 1.1 + k) * 0.05) * ease(ov)); sp.material.opacity = sp.userData.op * (enabled(centerIdx) ? 1 : 0.15); });
  if (!reduced && !paused) rings.forEach((r, k) => { r.rotation.y += dt * (k ? -0.03 : 0.045); });

  // edges
  let shownE = 0;
  edges.forEach((e, i) => {
    const a = cur[e.s], b = cur[e.t];
    ePos.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6);
    const v = Math.min(vis[e.s], vis[e.t]);
    if (v >= 1) shownE++;
    const on = enabled(e.s) && enabled(e.t);
    const inF = !focus || (selected >= 0 ? (e.s === selected || e.t === selected) : (focus.has(e.s) && focus.has(e.t)));
    const base = e.k === "mention" ? 0.16 : e.k === "link" ? 0.7 : 0.38;
    const alpha = v * (on ? (inF ? (focus ? Math.min(base * 2.2, 0.95) : base) : 0.03) : 0.0);
    const ca = e.k === "mention" ? MENTION : nodes[e.s].col, cb = e.k === "mention" ? MENTION : nodes[e.t].col;
    eCol.set([ca.r, ca.g, ca.b, alpha, cb.r, cb.g, cb.b, alpha], i * 8);
  });
  eGeo.attributes.position.needsUpdate = true; eGeo.attributes.color.needsUpdate = true;

  // particles
  pInfo.forEach((p, k) => {
    const e = edges[p.e];
    const ok = vis[e.s] >= 1 && vis[e.t] >= 1 && enabled(e.s) && enabled(e.t) && (!focus || (focus.has(e.s) && focus.has(e.t)));
    if (!ok) { pArr.set([0, 9999, 0], k * 3); return; }
    const f = reduced ? p.ph : (p.ph + ambient * p.sp) % 1;
    v3.lerpVectors(cur[e.s], cur[e.t], f);
    pArr.set([v3.x, v3.y, v3.z], k * 3);
  });
  pGeo.attributes.position.needsUpdate = true;

  // camera: automatic pullback during growth until the viewer takes over
  if (growing && !userTook) {
    const k = ease(THREE.MathUtils.clamp(gt / (GROW_T + 1), 0, 1));
    const dist = (55 + k * 285) * S;
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).add(dir.multiplyScalar(dist));
  }
  if (fly) {
    fly.t = Math.min(fly.t + dt / 0.9, 1);
    const k = ease(fly.t);
    controls.target.lerpVectors(fly.t0, fly.t1, k);
    camera.position.lerpVectors(fly.c0, fly.c1, k);
    if (fly.t >= 1) fly = null;
  }
  controls.autoRotate = !reduced && !paused && selected < 0;
  controls.update();

  // labels
  const showCats = selected < 0 && !(growing && gt < GROW_T * 0.6);
  catLabels.forEach((c) => placeCat(c.el, c.p, showCats && catOn[c.id] && c.members.some((i) => vis[i] > 0)));
  const want = [];
  if (hovered >= 0) want.push(hovered);
  if (selected >= 0) { want.push(selected); [...nodes[selected].nb].slice(0, 16).forEach((i) => want.push(i)); }
  else if (focus && focus.size <= 14) focus.forEach((i) => want.push(i));
  const uniq = [...new Set(want)].filter((i) => enabled(i) && vis[i] > 0);
  uniq.forEach((i, k) => { const el = nodeLabel(k); el.textContent = nodes[i].title; el.classList.toggle("hover", i === hovered || i === selected); place(el, cur[i], true); });
  for (let k = uniq.length; k < pool.length; k++) pool[k].style.display = "none";

  const ec = growing ? shownE : edges.length, nc = growing ? shown : N;
  $("#count").innerHTML = `<b>${nc}</b> / ${N} notes · <b>${ec}</b> connections`;
  $("#cN").textContent = nc; $("#cE").textContent = ec;

  composer.render();
  requestAnimationFrame(frame);
}

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2();
function pick(ev) {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(meshes.filter((m, i) => enabled(i) && vis[i] > 0.5).map((x) => x.m));
  return hits.length ? hits[0].object.userData.i : -1;
}
renderer.domElement.addEventListener("pointermove", (ev) => {
  if (ev.pointerType !== "mouse") return;
  hovered = pick(ev); renderer.domElement.style.cursor = hovered >= 0 ? "pointer" : "grab";
});
let down = null;
renderer.domElement.addEventListener("pointerdown", (ev) => { down = [ev.clientX, ev.clientY]; });
renderer.domElement.addEventListener("pointerup", (ev) => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 6) return;
  const i = pick(ev);
  if (i >= 0) select(i, true); else if (selected >= 0) select(-1);
});

function select(i, flyTo) {
  selected = i;
  if (i >= 0) { healthOn = false; document.body.classList.remove("menu"); }
  refresh(); renderDetail();
  if (i >= 0 && flyTo) {
    const p = pos[i].clone();
    const dir = p.length() > 1 ? p.clone().normalize() : camera.position.clone().sub(controls.target).normalize();
    fly = { t: 0, t0: controls.target.clone(), t1: p.clone().multiplyScalar(0.55), c0: camera.position.clone(), c1: p.clone().add(dir.multiplyScalar(110)) };
    userTook = true;
  }
}

function renderDetail() {
  const d = $("#detail");
  if (selected < 0) { d.hidden = true; d.innerHTML = ""; return; }
  const n = nodes[selected], c = CAT[n.cat];
  const item = (ei, other) => {
    const e = edges[ei], o = nodes[other];
    const kind = e.k === "link" ? "link" : e.k === "mention" ? "mention" : "reference";
    return `<li><button type="button" data-go="${other}"><i style="background:${CAT[o.cat].color}"></i><span>${esc(o.title)}</span><em>${kind}</em></button></li>`;
  };
  const out = n.out.map((ei) => item(ei, edges[ei].t)).join("");
  const inc = n.inc.map((ei) => item(ei, edges[ei].s)).join("");
  const flags = [];
  if (n.stub) flags.push(`<span class="tag alert">Stub: under ${G.stubWords} words</span>`);
  if (n.private) flags.push(`<span class="tag alert">Private</span>`);
  if (!n.nb.size) flags.push(`<span class="tag alert">No connections</span>`);
  d.innerHTML = `
    <button class="x" type="button" aria-label="Close note">×</button>
    <span class="chip"><i style="background:${c.color}"></i>${esc(c.label)}</span>
    <h2>${esc(n.title)}</h2>
    <div class="path">${esc(n.id)}</div>
    <div class="meta"><span class="tag">${n.words.toLocaleString()} words</span><span class="tag">${n.nb.size} connected notes</span>${flags.join("")}</div>
    ${n.summary ? `<p class="sum">${esc(n.summary)}</p>` : ""}
    ${n.sections.length ? `<h3>Sections</h3><ul class="secs">${n.sections.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
    ${out ? `<h3>Points to</h3><ul class="links">${out}</ul>` : ""}
    ${inc ? `<h3>Referenced by</h3><ul class="links">${inc}</ul>` : ""}`;
  d.hidden = false; d.scrollTop = 0;
}
$("#detail").addEventListener("click", (ev) => {
  if (ev.target.closest(".x")) { select(-1); return; }
  const b = ev.target.closest("[data-go]"); if (b) select(+b.dataset.go, true);
});

function renderSide() {
  const counts = {}; nodes.forEach((n) => (counts[n.cat] = (counts[n.cat] || 0) + 1));
  $("#src").innerHTML = G.categories.map((c) => `
    <button type="button" class="srow ${catOn[c.id] ? "" : "off"}" data-cat="${c.id}" title="${esc(c.blurb)}" aria-pressed="${catOn[c.id]}">
      <span class="dot" style="background:${c.color};color:${c.color}"></span><span class="nm">${esc(c.label)}</span><span class="ct">${counts[c.id] || 0}</span>
    </button>
    <button type="button" class="solo ${solo === c.id ? "on" : ""}" data-solo="${c.id}" aria-label="Show only ${esc(c.label)}">${solo === c.id ? "all" : "solo"}</button>`).join("");
  const stubs = nodes.filter((n) => n.stub).length;
  const lone = nodes.filter((n) => !n.nb.size).length;
  $("#health").innerHTML = `
    <button type="button" class="hrow ${stubs ? "alert" : ""} ${healthOn ? "on" : ""}" id="stubBtn"><span>Stubs, under ${G.stubWords} words</span><b>${stubs}</b></button>
    <div class="hrow" style="cursor:default"><span>Notes with no connections</span><b>${lone}</b></div>`;
  const q = query.toLowerCase();
  $("#inv").innerHTML = G.categories.map((c) => {
    const items = nodes.map((n, i) => [n, i]).filter(([n]) => n.cat === c.id && (!q || (n.title + " " + n.id + " " + n.summary).toLowerCase().includes(q)));
    if (!items.length) return "";
    return `<div><h4><i style="background:${c.color}"></i>${esc(c.label)}</h4><ul>${items.map(([n, i]) => `<li><button type="button" data-go="${i}">${esc(n.title)}</button></li>`).join("")}</ul></div>`;
  }).join("") || `<p style="color:var(--muted);margin:0">No notes match "${esc(query)}".</p>`;
}
$("#side").addEventListener("click", (ev) => {
  const row = ev.target.closest("[data-cat]");
  if (row) { const id = row.dataset.cat; catOn[id] = !catOn[id]; solo = null; if (selected >= 0 && !catOn[nodes[selected].cat]) select(-1); refresh(); return; }
  const so = ev.target.closest("[data-solo]");
  if (so) {
    const id = so.dataset.solo;
    if (solo === id) { solo = null; Object.keys(catOn).forEach((k) => (catOn[k] = true)); }
    else { solo = id; Object.keys(catOn).forEach((k) => (catOn[k] = k === id)); }
    if (selected >= 0 && !catOn[nodes[selected].cat]) select(-1);
    refresh(); return;
  }
  if (ev.target.closest("#stubBtn")) { healthOn = !healthOn; if (healthOn) { selected = -1; renderDetail(); } refresh(); return; }
  const go = ev.target.closest("[data-go]"); if (go) select(+go.dataset.go, true);
});
$("#q").addEventListener("input", (ev) => { query = ev.target.value.trim(); if (query && selected >= 0) { selected = -1; renderDetail(); } refresh(); });

function play() {
  select(-1); growing = true; paused = false; gt = 0; userTook = false;
  controls.target.set(0, 0, 0);
  camera.position.set(0, 18, 55);
  $("#playBtn").textContent = "Replay growth"; $("#pauseBtn").textContent = "Pause";
}
$("#playBtn").addEventListener("click", play);
$("#pauseBtn").addEventListener("click", () => { paused = !paused; $("#pauseBtn").textContent = paused ? "Resume" : "Pause"; });
$("#cineBtn").addEventListener("click", () => {
  const on = document.body.classList.toggle("cinema");
  $("#cineBtn").textContent = on ? "Exit cinema" : "Cinema";
  if (on) play();
});
$("#resetBtn").addEventListener("click", () => {
  select(-1); fly = { t: 0, t0: controls.target.clone(), t1: new THREE.Vector3(), c0: camera.position.clone(), c1: new THREE.Vector3(0, 60 * S, 330 * S) };
});
$("#menuBtn").addEventListener("click", () => document.body.classList.toggle("menu"));
addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") {
    if (document.body.classList.contains("cinema")) $("#cineBtn").click();
    else if (selected >= 0) select(-1);
  }
});

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h); composer.setSize(w, h); bloom.setSize(w, h);
  camera.aspect = w / h;
  if (w < 760 && camera.position.length() > 300 * S && !growing) camera.position.setLength(430 * S);
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
nodes.forEach((n, i) => cur[i].copy(pos[i]));
refresh();
if (!G.credit) $("#credit").remove();
$("#playBtn").textContent = "Watch it grow";
requestAnimationFrame(frame);
</script>
